name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: docker compose config

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
      - name: Deploy verified main to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PROJECT_DIR: ${{ secrets.VPS_PROJECT_DIR }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          remote_project_dir=$(printf '%q' "$VPS_PROJECT_DIR")
          ssh -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" "VPS_PROJECT_DIR=$remote_project_dir bash -s" <<'REMOTE'
          set -euo pipefail
          : "${VPS_PROJECT_DIR:?VPS_PROJECT_DIR is required}"
          case "$VPS_PROJECT_DIR" in
            /opt/*|/srv/*) ;;
            *) echo "VPS_PROJECT_DIR must be under /opt or /srv" >&2; exit 1 ;;
          esac
          cd "$VPS_PROJECT_DIR"
          git status --short
          if [ -n "$(git status --porcelain)" ]; then
            echo "Refusing to deploy over local VPS changes." >&2
            exit 1
          fi
          git fetch origin main
          git merge --ff-only origin/main
          docker compose config
          docker compose build
          docker compose up -d
          docker compose ps
          curl -fsS http://127.0.0.1:8080/healthz/
          REMOTE
