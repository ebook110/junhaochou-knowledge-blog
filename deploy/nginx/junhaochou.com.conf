server {
  listen 80;
  listen [::]:80;
  server_name junhaochou.com www.junhaochou.com;
  return 301 https://junhaochou.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name junhaochou.com www.junhaochou.com;

  ssl_certificate /etc/nginx/junhaochou.com/origin.pem;
  ssl_certificate_key /etc/nginx/junhaochou.com/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    # Cache-Control is intentionally passed through from the Docker Nginx.
    # Keep this host proxy free of overlapping cache headers.
    # Must match the production VPS_HOST_PORT value. The shared production host uses 8081.
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
