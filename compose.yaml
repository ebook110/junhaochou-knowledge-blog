name: junhaochou-knowledge-blog

services:
  junhaochou-blog:
    build:
      context: .
      args:
        BUILD_REVISION: ${BUILD_REVISION:-local}
    image: junhaochou-knowledge-blog:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
