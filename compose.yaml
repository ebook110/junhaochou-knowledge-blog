name: junhaochou-knowledge-blog

services:
  junhaochou-blog:
    build: .
    image: junhaochou-knowledge-blog:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
